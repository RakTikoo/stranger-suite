[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stranger-suite"
dynamic = ["version"]
description = "Fresh-eyes testing: Fresh-Eyes follows your README like a brand-new user and reports where a stranger gets stuck; Stranger API checks whether an AI agent can use your API from the docs alone."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RakTikoo" }]
keywords = [
    "readme-testing",
    "api-testing",
    "ai-agents",
    "documentation-testing",
    "developer-tools",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.scripts]
fresh-eyes = "stranger_suite.fresh_eyes.cli:main"
stranger-api = "stranger_suite.stranger_api.cli:main"

[project.urls]
Homepage = "https://github.com/RakTikoo/stranger-suite"
Repository = "https://github.com/RakTikoo/stranger-suite"
Issues = "https://github.com/RakTikoo/stranger-suite/issues"

[tool.setuptools.dynamic]
version = { attr = "stranger_suite.__version__" }

[tool.setuptools.packages.find]
include = ["stranger_suite*"]
